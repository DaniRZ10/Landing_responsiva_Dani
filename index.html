<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Responsiva</title>
    <link rel="stylesheet" href="./CSS/style.css" />
    <link rel="stylesheet" href="./CSS/dark.css" />
  </head>
  <body>
    <header>
      <nav></nav>
    </header>
    <main>
      <div class="container">
        <div class="hero">
          <h2>Descubre el fondo del mar en plena Sevilla</h2>
          <p>
            Recorre tres ecosistemas marinos a tu ritmo del arrecife de coral a
            las profundidades abisales.
          </p>
          <button>Reserva tu Visita</button>
        </div>
        <div class="cards">
          <h2>Elige tu zona favorita</h2>
          <p>Tres ecosistemas, una sola visita.</p>
          <div class="card" id="coral"></div>
          <div class="card" id="manglares"></div>
          <div class="card" id="fosa_abisal"></div>
        </div>
        <div class="discover">
          <h2>Echa un vistazo</h2>
          <p>Una experiencia sin igual.</p>
          <div class="imagen-concha">
            <img src="IMG/concha-abierta.png" alt="" />
          </div>
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
